name: Windows Remote Access

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  remote-access:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force

      - name: Create User
        shell: powershell
        run: |
          $password = ConvertTo-SecureString "Baim123" -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP2" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP2" -Password $password -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP2" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP2" -ErrorAction SilentlyContinue
          echo "USERNAME=RDP2" >> $env:GITHUB_ENV
          echo "PASSWORD=Baim123" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest $url -OutFile $file
          Start-Process msiexec.exe -ArgumentList @("/i", $file, "/quiet", "/norestart") -Wait

      - name: Connect Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}
          Start-Sleep -Seconds 10
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TS_IP=$ip" >> $env:GITHUB_ENV

      - name: Install OpenSSH
        shell: powershell
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0

      - name: Setup SSH Key
        shell: powershell
        run: |
          mkdir "$env:USERPROFILE\.ssh" -Force
          $key = "${{ secrets.VPS_KEY }}"
          $key = $key -replace ' ', "`n"
          $key | Out-File "$env:USERPROFILE\.ssh\id_rsa" -Encoding ascii -NoNewline
          icacls "$env:USERPROFILE\.ssh\id_rsa" /inheritance:r
          icacls "$env:USERPROFILE\.ssh\id_rsa" /grant:r "${env:USERNAME}:(F)"
      - name: Restore Data dari VPS
        shell: powershell
        run: |
          $result = ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo connected" 2>&1
          if ($result -eq "connected") {
            scp -o StrictHostKeyChecking=no -r ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/rdp-backup/ C:\rdp-data\
            Write-Host "Data restored!"
          } else {
            Write-Host "No backup found or VPS unreachable, fresh start"
      - name: Show Connection Info
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "====== RDP CONNECTION DETAILS ======"
          Write-Host "IP Address : $env:TS_IP"
          Write-Host "Username   : $env:USERNAME"
          Write-Host "Password   : $env:PASSWORD"
          Write-Host "===================================="
          Write-Host ""

      - name: Keep Alive + Auto Backup
        shell: powershell
        run: |
          Write-Host "Runner will stay active for 6 hours..."
          $endTime = (Get-Date).AddMinutes(330)
          while ((Get-Date) -lt $endTime) {
            Start-Sleep -Seconds 1800
            Write-Host "Backing up data to VPS..."
            scp -o StrictHostKeyChecking=no -r C:\rdp-data\ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/rdp-backup/
            Write-Host "Backup done!"
          }
